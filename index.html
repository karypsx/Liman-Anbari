<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anbar Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- QR Kod oxuyucu kitabxanası -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- CSV oxuyucu kitabxanası -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📦 Liman Anbarı</h1>
        
        <!-- QR Kamera ekranı bura gələcək -->
        <div id="reader" width="100%"></div>
        
        <!-- Nəticələrin çıxacağı yer -->
        <div id="result-container">
            <h2 id="ref-title">Rəf oxudulmayıb</h2>
            <ul id="product-list">
                <!-- Mallar bura JS vasitəsilə əlavə olunacaq -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
